naftiko: 1.0.0-alpha1
info:
  label: Amazon FreeRTOS Device Management
  description: Manage FreeRTOS software configurations and OTA firmware updates for microcontroller IoT devices.
  tags:
  - IoT
  - Embedded Systems
  - RTOS
  - OTA Updates
  - Firmware
  - AWS
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
    AWS_REGION: AWS_REGION
capability:
  consumes:
  - namespace: freertos
    ref: capabilities/shared/freertos.yaml
  exposes:
  - type: rest
    port: 8080
  - type: mcp
    port: 9090
  tools:
  - name: createSoftwareConfiguration
    description: Create a FreeRTOS software configuration
    inputSchema:
      type: object
      properties:
        name:
          type: string
        hardwarePlatform:
          type: string
        description:
          type: string
      required:
      - name
      - hardwarePlatform
  - name: listSoftwareConfigurations
    description: List FreeRTOS software configurations
    inputSchema:
      type: object
      properties:
        maxResults:
          type: integer
        nextToken:
          type: string
  - name: describeSoftwareConfiguration
    description: Get a FreeRTOS software configuration
    inputSchema:
      type: object
      properties:
        configId:
          type: string
      required:
      - configId
  - name: updateSoftwareConfiguration
    description: Update a FreeRTOS software configuration
    inputSchema:
      type: object
      properties:
        configId:
          type: string
        name:
          type: string
        description:
          type: string
      required:
      - configId
  - name: deleteSoftwareConfiguration
    description: Delete a FreeRTOS software configuration
    inputSchema:
      type: object
      properties:
        configId:
          type: string
      required:
      - configId
  - name: createOtaUpdate
    description: Create an OTA firmware update for FreeRTOS devices
    inputSchema:
      type: object
      properties:
        otaUpdateId:
          type: string
        targets:
          type: array
        files:
          type: array
        roleArn:
          type: string
        protocols:
          type: array
        description:
          type: string
      required:
      - otaUpdateId
      - targets
      - files
  - name: listOtaUpdates
    description: List OTA updates
    inputSchema:
      type: object
      properties:
        maxResults:
          type: integer
        nextToken:
          type: string
        otaUpdateStatus:
          type: string
  - name: getOtaUpdate
    description: Get an OTA update
    inputSchema:
      type: object
      properties:
        otaUpdateId:
          type: string
      required:
      - otaUpdateId
  - name: deleteOtaUpdate
    description: Delete an OTA update
    inputSchema:
      type: object
      properties:
        otaUpdateId:
          type: string
        deleteStream:
          type: boolean
        forceDeleteAWSJob:
          type: boolean
      required:
      - otaUpdateId
  - name: listTagsForResource
    description: List tags for a FreeRTOS resource
    inputSchema:
      type: object
      properties:
        resourceArn:
          type: string
      required:
      - resourceArn
  - name: tagResource
    description: Tag a FreeRTOS resource
    inputSchema:
      type: object
      properties:
        resourceArn:
          type: string
        tags:
          type: object
      required:
      - resourceArn
      - tags
